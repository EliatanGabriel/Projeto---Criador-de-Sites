name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, curl, fileinfo, xml, tokenizer, zip
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Setup .env
        run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite
      - name: Migrate
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force
      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          APP_ENV: testing
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          VITE_APP_NAME: "WebStudio OS"
        run: npm run build

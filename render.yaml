# PostgreSQL via Supabase (D-043): banco persistente gerenciado.
# Fila e scheduler rodam dentro do mesmo container (supervisord),
# compartilhando a mesma conexao Postgres.
# Variáveis no painel Render (Environment) — NUNCA versionar segredos:
#   - APP_KEY (base64, fixa — credenciais cifradas dependem dela)
#   - DB_URL (connection string do Supabase, ex.: postgresql://postgres:<senha>@db.<ref>.supabase.co:5432/postgres?sslmode=require)
#   - APP_URL (URL HTTPS da aplicação)
#   - INITIAL_ADMIN_EMAIL / INITIAL_ADMIN_PASSWORD (cria o OWNER inicial via webstudio:ensure-admin)

services:
  - type: web
    name: webstudio-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "WebStudio OS"
      - key: APP_LOCALE
        value: pt-BR
      - key: APP_FALLBACK_LOCALE
        value: pt-BR
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_URL
        fromService:
          name: webstudio-os
          type: web
          property: external_url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: database
    # Persistência de uploads locais (storage/app/private) — plano pago no Render
    disk:
      name: webstudio-storage
      mountPath: /app/storage/app/private
      sizeGB: 1

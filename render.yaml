# 100% SQLite (D-041): sem Postgres/Supabase, sem worker/cron separados.
# Fila e scheduler rodam dentro do mesmo container (supervisord),
# compartilhando o mesmo ficheiro SQLite.
# ATENÇÃO: o filesystem do Render é efémero — os dados do SQLite
# são perdidos a cada redeploy/restart. Para persistir, monte um
# Persistent Disk (plano pago) em /app/database.
# Variáveis no painel Render (Environment):
#   - APP_KEY (base64, fixa — credenciais cifradas dependem dela)
#   - APP_URL (URL HTTPS da aplicação)

services:
  - type: web
    name: webstudio-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "WebStudio OS"
      - key: APP_LOCALE
        value: pt-BR
      - key: APP_FALLBACK_LOCALE
        value: pt-BR
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_URL
        fromService:
          name: webstudio-os
          type: web
          property: external_url
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
    # Opcional (persistência): descomentar com plano pago no Render
    # disk:
    #   name: webstudio-db
    #   mountPath: /app/database
    #   sizeGB: 1
